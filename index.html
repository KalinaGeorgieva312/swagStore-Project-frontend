<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image/png" href="C:\Users\GeorgievaK\Code\swagstorefrontend\favicon/favicon-96x96.png"/>
    <title>swagStore</title>
</head>
<body style ="background-color:powderblue;">
	<style>
	@keyframes animations {
	0% {background-color: red; left: 0px; top: -0px;}
	25% {background-color: yellow; left: 200px; top: 0px;}
	50% {background-color: green; left: 0px; top: 200px;}
	100% {background-color: blue; left: 0px; top: 0px;}
	}
	
	@keyframes flyingText {
	0% {top: -1900px;}
	100% {top: 0px;}
	}
	
	.currentTime {
	position: fixed;
    top: 10px;    
    right: 10px;  
    font-size: 12px;
    color: #333;
    z-index: 1000;
	}
	
	h1 {
	height: 70px;
	background-color: red;
	animation-name: animations;
	animation-duration: 10s;
	animation-iteration-count: infinite;
	animation-timing-function: ease-in-out;
	animation-direction: alternate;
	animation-fill-mode: forwards;
	font-size: 300%;
	}
	
	@media screen and (width < 750px) {
	h1 {
	font-size:1.5rem;
	}
	}
	
	h2 {
	left: 800px;
	top: 80px;
	animation: flyingText 1s ease-in-out;
	z-index: 1;
	}
	
	.form-group {
    max-width: 460px;
    margin: 60px auto;
    padding: 10px;
	}

	.group1,
	.group2 {
    display: flex;
	flex-direction: row;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
	}

	label {
    flex: 0 0 110px; 
    text-align: right;
	}

	input {
    flex: 1 1 auto;
    min-width: 0;         
    padding: 10px 12px;   
    box-sizing: border-box;
	}

	button {
    display: block;
    width: 100%;
    padding: 8px 20px;
    margin: 12px;
    background-color: #04AA6D;
    color: white;
    border: none;
    cursor: pointer;
	}
	
	.categories {
	display: flex;
	justify-content: space-between;
	}
	
	.mainDatabase {
	max-width: 800px;
    margin: 60px auto;
    padding: 10px;
	}
	
	#product-container:last-child {
	margin-bottom: 20px;
	}

	.filterByPrice {
		margin-top: 20px;
		display: flex;
		flex-direction: row;
    	align-items: center;
    	gap: 10px;
    	margin-bottom: 12px;
		max-width: 460px;
    	margin: 60px auto;
    	padding: 10px;
		display: none;
	}

	.Cart {
		display: none;
	}

	
	</style>
    <h1 style="text-align:center; font-family:verdana">Willkommen im swagStore</h1>
	<div class = "currentTime">
		<div id = "datetime";></div>
	</div>
	<button id="admin" style="display:none; border: 1px solid black; position: relative; cursor: pointer; top: 0px; left: 0px; width: 10%; border-radius: 4px;" onclick="location.href = 'C:/Users/GeorgievaK/Code/swagstorefrontend/adminMenu.html'">Admin Menu</button>
	<div class = "form-group">
		<div class ="group1">
			<label>Username:</label>
			<input/ id = "username"; autocomplete = "off">
		</div>
		<div class = "group2">
			<label>Password:</label>
			<input/ id = "password"; autocomplete = "off"; type = "password">
		</div>
		<button id = "loginButton"; style="text-align:center;" onclick ="document.getElementById('logoutBtn').style.display = 'block';">Einloggen</button>
		<button id = "logoutBtn"; style="display:none; background-color:red; border-radius: 4px; border: 1px solid black;" onclick="logOut(this)">Abmelden</button>
	</div>
	<div class = "form-group">
		<h2 id = "header-small"; style="text-align:center; font-family:verdana; font-size: 150%;"></h2>
		<h3 id = "headerFilter"; style="text-align:center; font-family:verdana; font-size: 100%; display:none;">Filtern nach Brand oder Type:</h3>
	</div>
	<div class = "categories">
		<div id="brandContainer"></div> 
		<div id="typeContainer"></div>
	</div>
	<div class = "filterByPrice">
		<label for="priceFilter" style = "font-size: 1rem;">Filtern nach Preis:</label>
		<input id = "priceFilter" autocomplete = "off" type = "text" step = "any">
		<button id = "filterBtn" style="background-color:white; color:black; border: 1px solid gray; border-radius: 4px;" onclick="drawProducts()">Filtern</button>
	</div>
	<div class = "Cart">
		<button id = "basket" style="border: 1px solid black; width: 110px; border-radius: 4px;" onclick="displayCart(this)">Warenkorb</button>
	</div>
	<div class="mainDatabase">
		<h4 id="brandName"; style="font-family:verdana; font-size: 130%;"></h4>
		<ul id="product-container"></ul>
	</div>
	
	
</body>

<script src="index.js"></script>
<script src="shoppingCart.js"></script>

</html>
